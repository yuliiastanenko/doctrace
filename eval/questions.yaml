- id: q01
  type: fact
  question: What is the maximum fine a company can face for engaging in prohibited AI practices?
  expected:
    - {ref: "ai_act:article_99(3)", contains: "EUR 35 000 000"}
  answer_note: Up to EUR 35 000 000 or 7 % of total worldwide annual turnover, whichever is higher.

- id: q02
  type: fact
  question: What is the fine for supplying incorrect or misleading information to notified bodies or authorities under the AI Act?
  expected:
    - {ref: "ai_act:article_99(5)", contains: "EUR 7 500 000"}
  answer_note: Up to EUR 7 500 000 or 1 % of total worldwide annual turnover, whichever is higher.

- id: q03
  type: fact
  question: How are AI Act fines calculated for SMEs and start-ups?
  expected:
    - {ref: "ai_act:article_99(6)", contains: "whichever thereof is lower"}
  answer_note: The lower of the percentage or the fixed amount applies.

- id: q04
  type: fact
  question: What fines can the Commission impose on providers of general-purpose AI models?
  expected:
    - {ref: "ai_act:article_101(1)", contains: "EUR 15 000 000"}
  answer_note: Up to 3 % of annual total worldwide turnover or EUR 15 000 000, whichever is higher.

- id: q05
  type: fact
  question: What is the general deadline for a provider to report a serious incident involving a high-risk AI system?
  expected:
    - {ref: "ai_act:article_73(2)", contains: "not later than 15 days"}
  answer_note: Immediately after establishing a causal link, and in any event not later than 15 days after becoming aware. Shorter deadlines apply to widespread infringements (two days, 73(3)) and deaths (ten days, 73(4)).

- id: q06
  type: fact
  question: For how long must deployers keep the logs generated by a high-risk AI system?
  expected:
    - {ref: "ai_act:article_26(6)", contains: "at least six months"}
  answer_note: For a period appropriate to the intended purpose, of at least six months, unless other law provides otherwise.

- id: q07
  type: fact
  question: For how long must a provider keep the technical documentation of a high-risk AI system?
  expected:
    - {ref: "ai_act:article_18(1)", contains: "10 years"}
  answer_note: 10 years after the system has been placed on the market or put into service.

- id: q08
  type: fact
  question: When does the AI Act generally start to apply?
  expected:
    - {ref: "ai_act:article_113", contains: "It shall apply from 2 August 2026"}
  answer_note: From 2 August 2026, with earlier dates for some chapters.

- id: q09
  type: fact
  question: From what date do the prohibitions on AI practices apply?
  expected:
    - {ref: "ai_act:article_113", contains: "Chapters I and II shall apply from 2 February 2025"}
  answer_note: Chapters I and II, including Article 5, apply from 2 February 2025.

- id: q10
  type: fact
  question: How does the AI Act define an AI system?
  expected:
    - {ref: "ai_act:article_3", contains: "'AI system' means a machine-based system"}
  answer_note: A machine-based system designed to operate with varying levels of autonomy that infers from input how to generate outputs.

- id: q11
  type: fact
  question: What AI literacy obligations do providers and deployers have?
  expected:
    - {ref: "ai_act:article_4", contains: "sufficient level of AI literacy"}

- id: q12
  type: fact
  question: Is social scoring of people by AI systems allowed?
  expected:
    - {ref: "ai_act:article_5(1)", contains: "social behaviour"}
  answer_note: No, it is prohibited under Article 5(1)(c) when it leads to detrimental or unjustified treatment.

- id: q13
  type: fact
  question: Can employers use AI to recognise the emotions of their employees?
  expected:
    - {ref: "ai_act:article_5(1)", contains: "infer emotions of a natural person in the areas of workplace"}
  answer_note: No, prohibited except for medical or safety reasons.

- id: q14
  type: fact
  question: When may police use real-time remote biometric identification in public spaces?
  expected:
    - {ref: "ai_act:article_5(1)", contains: "strictly necessary for one of the following objectives"}
  answer_note: Only when strictly necessary for listed objectives such as searching for victims, preventing imminent threats, or locating suspects of serious crimes.

- id: q15
  type: fact
  question: What transparency obligation applies to providers of AI systems that generate synthetic audio, images, video or text?
  expected:
    - {ref: "ai_act:article_50(2)", contains: "machine-readable format"}
  answer_note: Outputs must be marked in a machine-readable format and detectable as artificially generated.

- id: q16
  type: fact
  question: What must deployers of emotion recognition systems tell the people exposed to them?
  expected:
    - {ref: "ai_act:article_50(3)", contains: "emotion recognition system"}

- id: q17
  type: fact
  question: Which deployers must carry out a fundamental rights impact assessment?
  expected:
    - {ref: "ai_act:article_27(1)", contains: "bodies governed by public law"}

- id: q18
  type: fact
  question: What kind of process must the risk management system for high-risk AI be?
  expected:
    - {ref: "ai_act:article_9(2)", contains: "continuous iterative process"}

- id: q19
  type: fact
  question: What quality criteria apply to training, validation and testing data sets for high-risk AI systems?
  expected:
    - {ref: "ai_act:article_10(3)", contains: "free of errors and complete"}

- id: q20
  type: fact
  question: What is the aim of human oversight of high-risk AI systems?
  expected:
    - {ref: "ai_act:article_14(2)", contains: "prevent or minimise the risks"}

- id: q21
  type: fact
  question: What documentation must providers of general-purpose AI models make publicly available about training data?
  expected:
    - {ref: "ai_act:article_53(1)", contains: "sufficiently detailed summary"}

- id: q22
  type: fact
  question: By when must each Member State have an AI regulatory sandbox operational?
  expected:
    - {ref: "ai_act:article_57(1)", contains: "operational by 2 August 2026"}

- id: q23
  type: fact
  question: Which uses of AI in employment and recruitment are classified as high-risk?
  expected:
    - {ref: "ai_act:annex_iii", contains: "recruitment or selection of natural persons"}

- id: q24
  type: reference
  question: What does Article 6(3) of the AI Act say?
  expected:
    - {ref: "ai_act:article_6(3)", contains: "shall not be considered to be high-risk"}

- id: q25
  type: reference
  question: What does Annex III point 1 of the AI Act cover?
  expected:
    - {ref: "ai_act:annex_iii", contains: "Biometrics"}

- id: q26
  type: reference
  question: Summarise Article 26 of the AI Act.
  expected:
    - ai_act:article_26

- id: q27
  type: reference
  question: What is GDPR Article 17 about?
  expected:
    - gdpr:article_17

- id: q28
  type: fact
  question: Within how many hours must a controller notify a personal data breach to the supervisory authority?
  expected:
    - {ref: "gdpr:article_33(1)", contains: "72 hours"}

- id: q29
  type: fact
  question: What is the maximum administrative fine under the GDPR?
  expected:
    - {ref: "gdpr:article_83(5)", contains: "20 000 000 EUR"}
  answer_note: Up to EUR 20 000 000 or 4 % of total worldwide annual turnover, whichever is higher. The same cap applies to non-compliance with a supervisory authority order under 83(6).

- id: q30
  type: fact
  question: Which GDPR infringements are subject to fines of up to EUR 10 000 000 or 2 % of turnover?
  expected:
    - {ref: "gdpr:article_83(4)", contains: "10 000 000 EUR"}

- id: q31
  type: fact
  question: From what age can a child consent to information society services under the GDPR?
  expected:
    - {ref: "gdpr:article_8(1)", contains: "at least 16 years old"}
  answer_note: 16, Member States may lower it to no less than 13.

- id: q32
  type: fact
  question: What are the lawful bases for processing personal data?
  expected:
    - {ref: "gdpr:article_6(1)", contains: "given consent to the processing"}

- id: q33
  type: fact
  question: How quickly must a controller respond to a data subject's request to exercise their rights?
  expected:
    - {ref: "gdpr:article_12(3)", contains: "within one month of receipt"}
  answer_note: Within one month, extendable by two further months.

- id: q34
  type: fact
  question: When must a data protection officer be designated?
  expected:
    - {ref: "gdpr:article_37(1)", contains: "core activities"}

- id: q35
  type: fact
  question: In what format must personal data be provided under the right to data portability?
  expected:
    - {ref: "gdpr:article_20(1)", contains: "structured, commonly used and machine-readable format"}

- id: q36
  type: fact
  question: Do people have a right not to be subject to decisions based solely on automated processing?
  expected:
    - {ref: "gdpr:article_22(1)", contains: "based solely on automated processing"}

- id: q37
  type: fact
  question: In which cases is a data protection impact assessment required?
  expected:
    - {ref: "gdpr:article_35(3)", contains: "systematic and extensive evaluation"}

- id: q38
  type: fact
  question: What does the storage limitation principle require?
  expected:
    - {ref: "gdpr:article_5(1)", contains: "storage limitation"}

- id: q39
  type: fact
  question: Which categories of personal data are considered special categories?
  expected:
    - {ref: "gdpr:article_9(1)", contains: "racial or ethnic origin"}

- id: q40
  type: fact
  question: When must a controller inform data subjects about a personal data breach?
  expected:
    - {ref: "gdpr:article_34(1)", contains: "high risk to the rights and freedoms"}

- id: q41
  type: ru
  lang: ru
  question: Какой максимальный штраф предусмотрен GDPR?
  expected:
    - {ref: "gdpr:article_83(5)", contains: "20 000 000 EUR"}

- id: q42
  type: ru
  lang: ru
  question: За сколько часов нужно сообщить надзорному органу об утечке персональных данных?
  expected:
    - {ref: "gdpr:article_33(1)", contains: "72 hours"}

- id: q43
  type: ru
  lang: ru
  question: Какие практики ИИ запрещены?
  expected:
    - {ref: "ai_act:article_5(1)", contains: "shall be prohibited"}

- id: q44
  type: ru
  lang: ru
  question: Сколько лет поставщик должен хранить техническую документацию высокорисковой системы ИИ?
  expected:
    - {ref: "ai_act:article_18(1)", contains: "10 years"}

- id: q45
  type: ru
  lang: ru
  question: Какой максимальный штраф грозит компании за запрещённые практики ИИ?
  expected:
    - {ref: "ai_act:article_99(3)", contains: "EUR 35 000 000"}

- id: q46
  type: multi
  question: Compare the maximum fines under the AI Act for prohibited practices with the maximum fines under the GDPR.
  expected:
    - {ref: "ai_act:article_99(3)", contains: "EUR 35 000 000"}
    - {ref: "gdpr:article_83(5)", contains: "20 000 000 EUR"}

- id: q47
  type: multi
  question: How do the obligations of providers of high-risk AI systems differ from those of deployers?
  expected:
    - ai_act:article_16
    - ai_act:article_26

- id: q48
  type: multi
  question: What rights do individuals have regarding automated decisions under the GDPR and the AI Act?
  expected:
    - {ref: "gdpr:article_22(1)", contains: "based solely on automated processing"}
    - {ref: "ai_act:article_86(1)", contains: "right to obtain from the deployer clear and meaningful explanations"}

- id: u01
  type: unanswerable
  question: What does the AI Act say about cryptocurrency mining?

- id: u02
  type: unanswerable
  question: What is the corporate income tax rate in Sweden?

- id: u03
  type: unanswerable
  question: What does the California Consumer Privacy Act require from businesses?

- id: u04
  type: unanswerable
  question: Which companies were fined under the AI Act in 2025?

- id: u05
  type: unanswerable
  question: Who is the current head of the European AI Office?

- id: u06
  type: unanswerable
  lang: ru
  question: Какой штраф за превышение скорости в Германии?

- id: u07
  type: unanswerable
  question: What are the requirements of the US Executive Order on artificial intelligence?

- id: u08
  type: unanswerable
  question: How many employees does the European Data Protection Board have?
